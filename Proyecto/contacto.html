<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contacto</title>
    <link rel="stylesheet" href="../CSS/style.css">

</head>

<body>

    <div class="cuerpoCompleto">
        <!-- Logo y Menu principal--->

        <div class="encabezado">
            <img src="../Imagenes/Logo.png" alt="Logo del portafolio" class="logo" width="150" height="150">
            <nav>
                <ul class="menu">

                    <li><a href="./index.html">Home</a></li>
                    <li><a href="./proyectos.html">Proyecto</a></li>
                    <li class="actual"><a href="#contacto">Contacto</a></li>
                </ul>
            </nav>
        </div>

     <main class="cuerpo">
  <h1>CONTACTESE CON NOSOTROS</h1>

  <div class="formularioCentrado" id="seccionFormulario">
    <div class="formulario">
      <form id="formulario" novalidate>
        <h2>Datos a enviar</h2>

        <div class="campo">
          <label for="nombreApellido">Nombre y Apellido:</label>
          <input type="text" id="nombreApellido" name="nombreApellido" placeholder="Ej: Ian Gómez" required>
          <p id="errorNombre" class="errorForm" aria-live="polite"></p>
        </div>

        <div class="campo">
          <label for="mail">Email:</label>
          <input type="email" id="mail" name="mail" placeholder="ejemplo@mail.com" required>
          <p id="errorEmail" class="errorForm" aria-live="polite"></p>
        </div>

        <div class="campo">
          <label for="telefono">Teléfono:</label>
          <input type="text" id="telefono" name="telefono" placeholder="Ej: 1123456789" required>
          <p id="errorTelefono" class="errorForm" aria-live="polite"></p>
        </div>

        <div class="campo">
          <label for="mensaje">Mensaje:</label>
          <textarea id="mensaje" name="mensaje" rows="4" placeholder="Escribí tu mensaje aquí..." required></textarea>
          <p id="errorMensaje" class="errorForm" aria-live="polite"></p>
        </div>

        <div class="botonDIV">
          <input type="submit" value="Enviar" class="boton enviar">
          <input type="reset" value="Reset" class="boton reset">
        </div>
      </form>
    </div>
  </div>
</main>

    <script src="../JS/script.js"></script>
</body>
